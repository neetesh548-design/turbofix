## Phase 5: Security Review

### 5.1 Common Vulnerabilities

**Check for:**

1. **XSS (Cross-Site Scripting)**
   ```typescript
   // ❌ DANGEROUS
   return <div dangerouslySetInnerHTML={{ __html: userInput }} />;
   
   // ✅ SAFE
   return <div>{userInput}</div>;
   ```

2. **SQL Injection** (via Supabase)
   ```typescript
   // ✅ SAFE - Supabase parameterized queries
   const { data } = await supabase
     .from('activity')
     .select('*')
     .eq('user_id', userId);  // userId is parameter
   
   // ❌ DANGEROUS - String concatenation
   // Don't do: `SELECT * FROM activity WHERE id = ${userId}`
   ```

3. **Authentication/Authorization**
   - [ ] User data is row-level secured in Supabase
   - [ ] No API keys exposed in frontend code
   - [ ] No sensitive data in localStorage
   - [ ] Proper checks before displaying data

4. **Dependency Vulnerabilities**
   ```bash
   npm audit
   ```
   - [ ] No high-severity vulnerabilities
   - [ ] No unpatched packages

**Issue Example:**
```
❌ SECURITY: Potential XSS vulnerability
File: src/components/Activity/ActivityCard.jsx:42
Code: <div dangerouslySetInnerHTML={{ __html: activityDescription }} />

RISK: If activityDescription comes from user input, could execute malicious code

FIX: Remove dangerouslySetInnerHTML and sanitize input
```

