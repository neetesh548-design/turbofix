git fetch origin

# 2. Checkout the feature branch
git checkout feature/activity-dashboard-analytics

# 3. Install dependencies (if needed)
npm install

# 4. Verify you're on correct branch
git branch -v  # Should show * feature/activity-dashboard-analytics
git log -1 --oneline  # Show latest commit
```

**Validation:**
- [ ] Branch checked out successfully
- [ ] No uncommitted changes in working directory
- [ ] Dependencies installed

